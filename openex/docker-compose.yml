version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: openex-db
    environment:
      POSTGRES_USER: openex
      POSTGRES_PASSWORD: openex
      POSTGRES_DB: openex
    ports:
      - "5432:5432"
    volumes:
      - openex-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openex -d openex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: openex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openex-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/openex
      SPRING_DATASOURCE_USERNAME: openex
      SPRING_DATASOURCE_PASSWORD: openex
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: change-me-in-prod-please-this-is-a-dev-secret-value
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  openex-db-data:
