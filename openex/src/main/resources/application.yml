spring:
  application:
    name: openex
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openex}
    username: ${SPRING_DATASOURCE_USERNAME:openex}
    password: ${SPRING_DATASOURCE_PASSWORD:openex}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_REDIS_SSL_ENABLED:false}
server:
  port: 8080
management:
  endpoint:
    health:
      show-details: always
openex:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-override-in-real-deployments-32bytes+}
    expiration-minutes: 60
logging:
  level:
    org.springframework.security: DEBUG
