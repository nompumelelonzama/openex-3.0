name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: openex

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openex
          POSTGRES_PASSWORD: openex
          POSTGRES_DB: openex
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U openex -d openex"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('openex/**/*.gradle*', 'openex/**/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Run unit + integration tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/openex
          SPRING_DATASOURCE_USERNAME: openex
          SPRING_DATASOURCE_PASSWORD: openex
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
        run: ./gradlew test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: openex/build/reports/tests/test